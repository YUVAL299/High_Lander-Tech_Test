# Runs published images instead of building from source.
#
#   IMAGE_OWNER=<github-owner> IMAGE_TAG=<git-sha> \
#     docker compose -f docker-compose.yml -f deploy/docker-compose.staging.yml up -d --no-build

services:
  backend:
    image: ghcr.io/${IMAGE_OWNER:?set IMAGE_OWNER}/high-lander-tech-test-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      HL_LOG_LEVEL: INFO

  frontend:
    image: ghcr.io/${IMAGE_OWNER:?set IMAGE_OWNER}/high-lander-tech-test-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
